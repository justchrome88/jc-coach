<!doctype html>
<html lang="{{ locale or 'ru' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "CS2 Personal Coach" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">CS2 Personal Coach</a>
      <nav class="nav">
        <a href="/">{{ t("nav.dashboard") }}</a>
        <a href="/stats">{{ t("nav.stats") }}</a>
        <a href="/coach">{{ t("nav.coach") }}</a>
        <a href="/matches">{{ t("nav.matches") }}</a>
        <a href="/upload">{{ t("nav.upload") }}</a>
        <a href="/report">{{ t("nav.report") }}</a>
        <a href="/settings/imports">{{ t("nav.accounts") }}</a>
        <span class="language-switch" aria-label="Language">
          <a class="{{ 'active' if locale == 'ru' else '' }}" href="/language/ru">{{ t("language.ru") }}</a>
          <a class="{{ 'active' if locale == 'en' else '' }}" href="/language/en">{{ t("language.en") }}</a>
        </span>
      </nav>
    </header>
    <main class="page">
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
